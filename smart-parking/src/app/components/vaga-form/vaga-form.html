<form class="form-nova-vaga" (ngSubmit)="salvar()" novalidate>
  <div class="form-title">
    <h3>Cadastrar Novo Sensor</h3>
    <span class="hint">Clique no mapa para pegar a posição</span>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Código da Vaga</label>
      <input type="text" [(ngModel)]="codigo" name="codigo" placeholder="Ex: C-01"
        [maxlength]="LIMITES.CODIGO_VAGA_MAX" required style="text-transform: uppercase;"
        [class.invalido]="tentouEnviar && erroCodigo" />
      @if (tentouEnviar && erroCodigo) { <small class="erro-campo">{{ erroCodigo }}</small> }
    </div>

    <div class="form-group">
      <label>Tarifa (R$/h)</label>
      <input type="number" step="0.50" [min]="LIMITES.PRECO_MIN" [max]="LIMITES.PRECO_MAX"
        [(ngModel)]="preco_hora" name="preco_hora" required
        [class.invalido]="tentouEnviar && erroPreco" />
      @if (tentouEnviar && erroPreco) { <small class="erro-campo">{{ erroPreco }}</small> }
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Tipo</label>
      <select [(ngModel)]="tipo" name="tipo">
        <option value="COMUM">Comum</option>
        <option value="ELETRICO">Elétrico</option>
        <option value="PCD">PCD</option>
        <option value="IDOSO">Idoso</option>
      </select>
    </div>

    <div class="form-group">
      <label>Status Inicial</label>
      <select [(ngModel)]="status" name="status">
        <option value="LIVRE">Livre</option>
        <option value="OCUPADA">Ocupada</option>
        <option value="RESERVADA">Reservada</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Latitude</label>
      <input type="number" step="0.000001" [(ngModel)]="lat" name="lat" required />
    </div>
    <div class="form-group">
      <label>Longitude</label>
      <input type="number" step="0.000001" [(ngModel)]="lng" name="lng" required />
    </div>
  </div>
  @if (tentouEnviar && erroCoordenadas) { <small class="erro-campo">{{ erroCoordenadas }}</small> }

  <div class="form-actions">
    <button type="button" class="btn-cancelar" (click)="fechar.emit()">Cancelar</button>
    <button type="submit" class="btn-salvar" [disabled]="salvando">Salvar Vaga</button>
  </div>
</form>
